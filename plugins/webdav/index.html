<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:transparent; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  body { display:flex; flex-direction:column; justify-content:flex-end; height:100vh; overflow:hidden; }
  #strip { height:40px; display:flex; align-items:center; gap:8px; padding:0 10px; cursor:pointer;
    overflow:hidden; white-space:nowrap; flex-shrink:0;
    background:#2b2c33; border:1px solid #41424d; border-radius:7px; }
  #strip .ic { color:#6fb7ff; flex-shrink:0; display:flex; }
  #strip .lb { font-size:11.5px; color:#c8cad4; overflow:hidden; text-overflow:ellipsis; }
  #strip .st { margin-left:auto; font-size:10px; color:#6a6b76; flex-shrink:0; }
  #strip.drop { border-color:#4c8dff; background:#2e3a52; }
  #panel { display:none; background:#1e1f24; border:1px solid #3a3b45; border-radius:10px;
    margin:4px 4px 6px; color:#d5d6de; font-size:12px; width:380px; height:480px;
    flex-direction:column; overflow:hidden; flex-shrink:0; }
  #panel.open { display:flex; }
  .bar { display:flex; align-items:center; gap:5px; padding:8px 10px; border-bottom:1px solid #2c2d34; flex-shrink:0; }
  .bar button { height:24px; padding:0 8px; border:1px solid #3a3b45; border-radius:6px;
    background:#141519; color:#9ab8e8; font-size:11px; cursor:pointer; white-space:nowrap; }
  .bar button:hover { border-color:#4c8dff; color:#fff; }
  #crumb { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:11px; color:#8ab8ff; font-family:Consolas,monospace; }
  #quota { font-size:10px; color:#6a6b76; font-family:Consolas,monospace; flex-shrink:0; white-space:nowrap; }
  #filter { height:22px; width:84px; background:#141519; border:1px solid #2c2d34; border-radius:6px;
    color:#e6e7ec; font-size:11px; padding:0 7px; outline:none; flex-shrink:0; }
  #filter:focus { border-color:#4c8dff; }
  #files { flex:1; overflow-y:auto; padding:4px 6px; }
  #files::-webkit-scrollbar { width:0; height:0; }
  .row { display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:6px; font-size:11.5px; }
  .row:hover { background:#26272e; }
  .row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:default; }
  .row.dir .nm { color:#8ab8ff; cursor:pointer; }
  .row .sz { color:#6a6b76; font-size:10px; font-family:Consolas,monospace; flex-shrink:0; }
  .row .op { display:flex; gap:4px; flex-shrink:0; }
  .row .op button { height:20px; padding:0 6px; font-size:10px; border:1px solid #3a3b45; border-radius:5px;
    background:#141519; color:#9a9ba6; cursor:pointer; }
  .row .op button:hover { border-color:#4c8dff; color:#fff; }
  .row .op button.danger:hover { border-color:#f85149; color:#f85149; }
  #cfg { padding:12px; display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
  #cfg[hidden], #nav[hidden] { display:none; } /* CSS display 会覆盖 hidden 属性的 UA 样式，必须显式补回 */
  #cfg input { height:28px; background:#141519; border:1px solid #2c2d34; border-radius:6px;
    color:#e6e7ec; font-size:12px; padding:0 9px; outline:none; }
  #cfg input:focus { border-color:#4c8dff; }
  #cfg .msg { font-size:11px; min-height:14px; }
  #cfg .msg.ok { color:#6ee7a0; } #cfg .msg.err { color:#f85149; }
  #empty { color:#4a4b55; font-size:11px; text-align:center; padding:18px 0; }
  #drop-tip { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(30,50,90,.85); color:#fff; font-size:13px; border-radius:10px; z-index:9; }
  body.dropping #drop-tip { display:flex; }
</style>
</head>
<body>
  <div id="panel">
    <div id="cfg" hidden>
      <input id="c-url" placeholder="服务器地址，如 https://dav.example.com/dav">
      <input id="c-user" placeholder="用户名">
      <input id="c-pass" type="password" placeholder="密码">
      <div style="display:flex;gap:8px">
        <button class="bar-btn" id="c-save" style="height:26px;padding:0 12px;border:1px solid #3a3b45;border-radius:6px;background:#141519;color:#9ab8e8;font-size:11.5px;cursor:pointer">保存并连接</button>
        <button class="bar-btn" id="c-cancel" style="height:26px;padding:0 12px;border:1px solid #3a3b45;border-radius:6px;background:#141519;color:#6a6b76;font-size:11.5px;cursor:pointer">取消</button>
      </div>
      <div class="msg" id="c-msg"></div>
    </div>
    <div class="bar" id="nav" hidden>
      <button id="b-up" title="上级目录">↑</button>
      <span id="crumb">/</span>
      <input id="filter" placeholder="过滤…">
      <span id="quota" title="服务器配额"></span>
      <button id="b-new" title="新建文件夹">＋目录</button>
      <button id="b-up2" title="上传文件">⇪ 上传</button>
      <button id="b-cfg" title="服务器设置">⚙</button>
      <button id="b-refresh" title="刷新">⟳</button>
    </div>
    <div id="files"></div>
    <div id="empty" hidden>空目录</div>
  </div>
  <div id="strip" title="点击展开网盘；把文件拖到条上可直接上传">
    <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0-.42-8.98 6 6 0 1 0-11.06 3.1A3.5 3.5 0 0 0 7 19.5z"/></svg></span>
    <span class="lb" id="strip-lb">网盘</span>
    <span class="st" id="strip-st"></span>
  </div>
  <div id="drop-tip">松开鼠标上传到网盘</div>
  <input type="file" id="file-pick" multiple hidden>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const strip = $('strip'), panel = $('panel');
  let expanded = false;
  let cfg = await tbp.config();
  let path = '/';           // 当前目录（服务器相对路径，'/' 开头）
  let entries = [];         // 当前目录项
  let busy = false;

  // ---------- 工具 ----------
  function b64str(s) {
    const bytes = new TextEncoder().encode(s);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function b64bytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function base() { return (cfg.url || '').replace(/\/+$/, ''); }
  function fullUrl(p) { return base() + p.split('/').map((s, i) => i === 0 ? s : encodeURIComponent(s)).join('/'); }
  function authHeaders() {
    const h = {};
    if (cfg.user) h['Authorization'] = 'Basic ' + b64str(cfg.user + ':' + (cfg.pass || ''));
    return h;
  }
  async function dav(method, p, opts) {
    opts = opts || {};
    const args = { method, url: fullUrl(p), maxBytes: 32 * 1024 * 1024 };
    args.headers = Object.assign(authHeaders(), opts.headers || {});
    if (opts.bodyBase64) { args.bodyBase64 = opts.bodyBase64; args.contentType = opts.contentType || 'application/octet-stream'; }
    else if (opts.body) { args.body = opts.body; }
    const r = await tbp.call('http.request', args);
    if (r.status >= 400) throw new Error('HTTP ' + r.status);
    return r;
  }
  function fmtSize(n) {
    if (n == null) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // ---------- 目录列表 ----------
  async function loadList() {
    if (!base()) { showCfg(true); return; }
    $('nav').hidden = false; $('cfg').hidden = true;
    $('strip-st').textContent = '…';
    $('crumb').textContent = path;
    loadQuota();
    try {
      const r = await dav('PROPFIND', path, { headers: { Depth: '1' }, body: '<?xml version="1.0"?><propfind xmlns="DAV:"><prop><displayname/><getcontentlength/><resourcetype/><getlastmodified/></prop></propfind>' });
      const doc = new DOMParser().parseFromString(r.body, 'text/xml');
      const responses = doc.getElementsByTagNameNS('*', 'response');
      const selfHref = fullUrl(path).replace(/\/$/, '') + '/';
      entries = [];
      for (const resp of responses) {
        const hrefEl = resp.getElementsByTagNameNS('*', 'href')[0];
        if (!hrefEl) continue;
        let href = relFromHref(safeDecode(hrefEl.textContent));
        const norm = href.replace(/\/$/, '');
        const cur = path.replace(/\/$/, '');
        if (norm === cur || href === path) continue; // 自身
        const isDir = !!resp.getElementsByTagNameNS('*', 'collection')[0] || href.endsWith('/');
        const nameEl = resp.getElementsByTagNameNS('*', 'displayname')[0];
        const sizeEl = resp.getElementsByTagNameNS('*', 'getcontentlength')[0];
        const modEl = resp.getElementsByTagNameNS('*', 'getlastmodified')[0];
        const name = nameEl && nameEl.textContent ? nameEl.textContent : (href.split('/').filter(Boolean).pop() || '');
        entries.push({ href, name, isDir, size: sizeEl ? +sizeEl.textContent : null, mtime: modEl ? modEl.textContent : '' });
      }
      entries.sort((a, b2) => (a.isDir === b2.isDir ? a.name.localeCompare(b2.name) : (a.isDir ? -1 : 1)));
      renderList();
      $('strip-st').textContent = entries.length + ' 项';
      $('strip-lb').textContent = path === '/' ? '网盘' : (path.split('/').filter(Boolean).pop() || '网盘');
    } catch (e) {
      $('strip-st').textContent = '连接失败';
      $('files').innerHTML = '<div id="empty" style="display:block;color:#f85149;font-size:11px;padding:18px 0;text-align:center">加载失败：' + esc(e.message || e) + '</div>';
    }
  }

  // 服务器返回的 href 规整化为相对路径（'/' 开头，保持解码后的原文——
  // 之后 fullUrl 会统一做一次 encodeURIComponent，这里绝不能再引入编码）。
  // 服务器可能返回三种形态：完整 URL、含部署前缀的根相对路径（如
  // /webdav/xxx，123pan 即如此）、纯相对路径。只剥完整 URL 会把
  // /webdav/xxx 当成相对路径，下次请求拼成 base+/webdav/xxx（前缀翻倍，
  // "第二级目录 404"的第一层根因）；用 new URL().pathname 剥前缀则会
  // 把中文重新百分号编码，再经 fullUrl 二次编码变成 %25E4...（404 的第二层根因）。
  function relFromHref(href) {
    const b = base();
    let h = href;
    if (h.startsWith(b)) {
      h = h.slice(b.length);
    } else {
      const m = /^[a-z][a-z0-9+.-]*:\/\/[^/]+(\/.*)?$/i.exec(h);
      let p = m ? (m[1] || '/') : h;               // 剥协议+主机（纯字符串，不重编码）
      let bp = '';
      try { bp = new URL(b).pathname.replace(/\/+$/, ''); } catch (e) {}
      if (p === bp) p = '/';
      else if (bp && p.startsWith(bp + '/')) p = p.slice(bp.length);
      h = p;
    }
    if (!h.startsWith('/')) h = '/' + h;
    return h;
  }
  // href 里可能含字面 %（非法转义序列），decodeURIComponent 会抛异常
  function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }

  // 服务器配额（quota-used-bytes / quota-available-bytes），失败静默——很多服务器不支持
  async function loadQuota() {
    $('quota').textContent = '';
    try {
      const r = await dav('PROPFIND', '/', { headers: { Depth: '0' },
        body: '<?xml version="1.0"?><propfind xmlns="DAV:"><prop><quota-used-bytes/><quota-available-bytes/></prop></propfind>' });
      const doc = new DOMParser().parseFromString(r.body, 'text/xml');
      const u = doc.getElementsByTagNameNS('*', 'quota-used-bytes')[0];
      const a = doc.getElementsByTagNameNS('*', 'quota-available-bytes')[0];
      if (u && a && (+u.textContent > 0 || +a.textContent > 0))
        $('quota').textContent = fmtSize(+u.textContent) + ' / ' + fmtSize(+u.textContent + +a.textContent);
    } catch (e) {}
  }

  function renderList() {
    const box = $('files');
    box.innerHTML = '';
    const kw = ($('filter').value || '').trim().toLowerCase();
    const shown = kw ? entries.filter(it => it.name.toLowerCase().includes(kw)) : entries;
    $('empty').hidden = shown.length > 0;
    if (kw && !shown.length) box.innerHTML = '<div style="color:#4a4b55;font-size:11px;text-align:center;padding:18px 0">无匹配项</div>';
    for (const it of shown) {
      const row = document.createElement('div');
      row.className = 'row' + (it.isDir ? ' dir' : '');
      // 超过 20 字截断加省略号，全名在悬浮提示里
      const dispName = it.name.length > 20 ? it.name.slice(0, 20) + '…' : it.name;
      row.innerHTML = '<span style="flex-shrink:0;color:' + (it.isDir ? '#8ab8ff' : '#6a6b76') + '">' +
        (it.isDir
          ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'
          : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>') +
        '</span><span class="nm" title="' + esc(it.name) + (it.mtime ? ('&#10;' + esc(it.mtime)) : '') + '">' + esc(dispName) + '</span>' +
        '<span class="sz">' + (it.isDir ? '' : fmtSize(it.size)) + '</span>' +
        '<span class="op">' +
        (it.isDir ? '' : '<button data-a="dl">下载</button>') +
        '<button data-a="mv">重命名</button>' +
        '<button data-a="del" class="danger">删除</button>' +
        '</span>';
      if (it.isDir) row.querySelector('.nm').onclick = () => { path = it.href.endsWith('/') ? it.href : it.href + '/'; loadList(); };
      row.querySelectorAll('.op button').forEach(btn => {
        btn.onclick = (e) => { e.stopPropagation(); act(btn.dataset.a, it, row); };
      });
      box.appendChild(row);
    }
  }

  async function act(a, it, rowEl) {
    try {
      if (a === 'del') {
        if (!confirm('删除「' + it.name + '」？')) return;
        await dav('DELETE', it.isDir ? (it.href.endsWith('/') ? it.href : it.href + '/') : it.href);
        loadList();
      } else if (a === 'mv') {
        // 行内重命名：WebView2 不支持 window.prompt（立即返回空，"点了没反应"），
        // 改为就地编辑框，Enter 提交 / Esc 取消 / 失焦提交
        const nmEl = rowEl && rowEl.querySelector('.nm');
        if (!nmEl) return;
        const input = document.createElement('input');
        input.value = it.name;
        input.style.cssText = 'flex:1;min-width:0;height:22px;background:#141519;border:1px solid #4c8dff;' +
          'border-radius:5px;color:#e6e7ec;font-size:11.5px;padding:0 6px;outline:none;';
        nmEl.replaceWith(input);
        input.focus(); input.select();
        let done = false;
        const restore = () => { if (!done) { done = true; renderList(); } };
        input.onkeydown = (e) => {
          if (e.key === 'Enter') input.blur();
          else if (e.key === 'Escape') restore();
          e.stopPropagation();
        };
        input.onblur = async () => {
          if (done) return;
          done = true;
          const nn = input.value.trim();
          if (!nn || nn === it.name) { renderList(); return; }
          try {
            const parent = it.href.slice(0, it.href.length - it.name.length);
            await dav('MOVE', it.href, { headers: { Destination: fullUrl(parent + nn) } });
            loadList();
          } catch (e) { alert('重命名失败：' + (e.message || e)); renderList(); }
        };
      } else if (a === 'dl') {
        // 先弹「另存为」选好路径，再下载写入——反过来（先下载完再弹框）
        // 大文件要干等十几秒，"点了没反应"
        const res = await tbp.call('fs.save_dialog', { defaultName: it.name });
        if (res.cancelled) { $('strip-st').textContent = '已取消保存'; setTimeout(loadList, 2000); return; }
        $('strip-st').textContent = '下载中… ' + it.name;
        const r = await dav('GET', it.href);
        const bodyBase64 = r.bodyBase64 || b64str(r.body || '');
        await tbp.call('fs.write_base64', { path: res.path, bodyBase64 });
        $('strip-st').textContent = '已保存：' + res.path;
        setTimeout(loadList, 2500);
      }
    } catch (e) { alert('操作失败：' + (e.message || e)); }
  }

  // ---------- 上传 ----------
  async function uploadFiles(files) {
    if (!base()) { showCfg(true); return; }
    let done = 0, fail = 0;
    $('strip-st').textContent = '上传 0/' + files.length;
    for (const f of files) {
      try {
        const dataUrl = await new Promise((res, rej) => {
          const rd = new FileReader();
          rd.onload = () => res(rd.result);
          rd.onerror = rej;
          rd.readAsDataURL(f);
        });
        const b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
        const target = path + (path.endsWith('/') ? '' : '/') + f.name;
        await dav('PUT', target, { bodyBase64: b64, contentType: f.type || 'application/octet-stream' });
        done++;
      } catch (e) { fail++; }
      $('strip-st').textContent = '上传 ' + (done + fail) + '/' + files.length;
    }
    $('strip-st').textContent = fail ? ('失败 ' + fail) : ('完成 ' + done);
    setTimeout(loadList, 400);
  }

  // ---------- 配置 ----------
  function showCfg(on) {
    $('cfg').hidden = !on;
    $('nav').hidden = on;
    $('files').innerHTML = '';
    $('empty').hidden = true;
    if (on) {
      $('c-url').value = cfg.url || '';
      $('c-user').value = cfg.user || '';
      $('c-pass').value = cfg.pass || '';
      $('c-msg').textContent = '';
      $('c-msg').className = 'msg';
    }
  }
  $('c-save').onclick = async () => {
    cfg.url = $('c-url').value.trim();
    cfg.user = $('c-user').value.trim();
    cfg.pass = $('c-pass').value;
    if (!cfg.url) { $('c-msg').textContent = '请填写服务器地址'; $('c-msg').className = 'msg err'; return; }
    try { await tbp.saveConfig({ url: cfg.url, user: cfg.user, pass: cfg.pass }); } catch (e) {}
    path = '/';
    await loadList();
  };
  $('c-cancel').onclick = () => { if (base()) { showCfg(false); loadList(); } };

  // ---------- 交互 ----------
  strip.onclick = async () => {
    expanded = !expanded;
    panel.classList.toggle('open', expanded);
    await tbp.call(expanded ? 'dock.expand' : 'dock.collapse', { height: 540 });
    if (expanded && !entries.length && !busy) loadList();
  };
  tbp.on('dock.collapsed', () => { expanded = false; panel.classList.remove('open'); });

  $('b-up').onclick = () => {
    if (path === '/') return;
    path = path.replace(/[^/]+\/$/, '');
    loadList();
  };
  $('b-refresh').onclick = loadList;
  $('filter').oninput = renderList;
  $('b-cfg').onclick = () => showCfg(true);
  $('b-new').onclick = async () => {
    const name = prompt('文件夹名称：');
    if (!name) return;
    try {
      await dav('MKCOL', path + (path.endsWith('/') ? '' : '/') + name);
      loadList();
    } catch (e) { alert('创建失败：' + (e.message || e)); }
  };
  $('b-up2').onclick = () => $('file-pick').click();
  $('file-pick').onchange = (e) => {
    if (e.target.files && e.target.files.length) uploadFiles(Array.from(e.target.files));
    e.target.value = '';
  };

  // 拖到条带 / 面板上上传
  for (const el of [strip, panel]) {
    el.addEventListener('dragover', (e) => { e.preventDefault(); strip.classList.add('drop'); document.body.classList.add('dropping'); });
    el.addEventListener('dragleave', (e) => { if (!el.contains(e.relatedTarget)) { strip.classList.remove('drop'); document.body.classList.remove('dropping'); } });
    el.addEventListener('drop', (e) => {
      e.preventDefault();
      strip.classList.remove('drop');
      document.body.classList.remove('dropping');
      const files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length) uploadFiles(Array.from(files));
    });
  }

  if (!base()) $('strip-st').textContent = '未配置';
  tbp.ready();
})();
</script>
</body>
</html>
