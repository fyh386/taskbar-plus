<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:transparent; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  body { display:flex; flex-direction:column; justify-content:flex-end; height:100vh; overflow:hidden; }
  #strip { height:40px; display:flex; align-items:center; gap:6px; padding:0 8px; cursor:pointer;
    overflow:hidden; white-space:nowrap; flex-shrink:0;
    background:#2b2c33; border:1px solid #41424d; border-radius:7px; overflow-x:auto; }
  #strip::-webkit-scrollbar { width:0; height:0; }
  .ico { width:26px; height:26px; flex-shrink:0; border-radius:6px; display:flex; align-items:center; justify-content:center;
    background:#141519; border:1px solid #3a3b45; color:#8ab8ff; font-size:11px; font-weight:600; cursor:pointer; }
  .ico:hover { border-color:#4c8dff; color:#fff; }
  .ico img { width:18px; height:18px; }
  .ico.add { color:#6a6b76; border-style:dashed; }
  #panel { display:none; background:#1e1f24; border:1px solid #3a3b45; border-radius:10px;
    margin:4px 4px 6px; color:#d5d6de; font-size:12px; width:290px;
    flex-direction:column; overflow:hidden; flex-shrink:0; }
  #panel.open { display:flex; }
  .hd { display:flex; align-items:center; gap:6px; padding:8px 10px; border-bottom:1px solid #2c2d34; flex-shrink:0; font-size:11.5px; color:#8ab8ff; }
  .hd button { margin-left:auto; height:24px; padding:0 9px; border:1px solid #3a3b45; border-radius:6px; background:#141519;
    color:#9ab8e8; font-size:11px; cursor:pointer; }
  .hd button:hover { border-color:#4c8dff; color:#fff; }
  #list { flex:1; overflow-y:auto; padding:5px 7px; max-height:260px; }
  #list::-webkit-scrollbar { width:0; }
  .it { display:flex; align-items:center; gap:8px; padding:6px 7px; border-radius:6px; }
  .it:hover { background:#26272e; }
  .it .sw { width:22px; height:22px; border-radius:5px; background:#141519; border:1px solid #3a3b45;
    display:flex; align-items:center; justify-content:center; color:#8ab8ff; font-size:10px; font-weight:600; flex-shrink:0; }
  .it .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px; }
  .it .pt { flex:2; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; color:#6a6b76; font-family:Consolas,monospace; }
  .it button { height:20px; padding:0 7px; font-size:10px; border:1px solid #3a3b45; border-radius:5px; background:#141519;
    color:#9a9ba6; cursor:pointer; }
  .it button:hover { border-color:#4c8dff; color:#fff; }
  .it button.danger:hover { border-color:#f85149; color:#f85149; }
  #editor { display:none; flex-direction:column; gap:7px; padding:10px; border-top:1px solid #2c2d34; flex-shrink:0; }
  #editor.open { display:flex; }
  #editor input { height:28px; background:#141519; border:1px solid #2c2d34; border-radius:6px;
    color:#e6e7ec; font-size:11.5px; padding:0 9px; outline:none; }
  #editor input:focus { border-color:#4c8dff; }
  #editor .rw { display:flex; gap:7px; }
  #editor button { flex:1; height:26px; border:1px solid #3a3b45; border-radius:6px; background:#141519;
    color:#9ab8e8; font-size:11px; cursor:pointer; }
  .tip { font-size:10px; color:#6a6b76; padding:6px 10px; line-height:1.6; }
</style>
</head>
<body>
  <div id="panel">
    <div class="hd">快捷启动管理 <button id="b-add">＋ 新增</button></div>
    <div id="list"></div>
    <div id="editor">
      <input id="e-name" placeholder="名称，如：记事本">
      <input id="e-path" placeholder="路径/网址：C:\app.exe 或 https://…（可点右侧选文件）">
      <div class="rw"><button id="e-pick">选择程序…</button><button id="e-save">保存</button><button id="e-cancel">取消</button></div>
    </div>
    <div class="tip">支持 .exe / .lnk / 文件夹 / 网址 https:// ；添加后图标直接出现在任务栏条上，点击即启动。</div>
  </div>
  <div id="strip" title="点击管理快捷启动"></div>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const strip = $('strip'), panel = $('panel');
  let expanded = false;
  let cfg = await tbp.config();
  let editIdx = -1;

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const items = () => (Array.isArray(cfg.items) ? cfg.items : []);

  function iconLetter(name) { return (name || '?').trim().charAt(0).toUpperCase(); }
  function isWeb(p) { return /^https?:\/\//.test(p || ''); }

  function renderStrip() {
    strip.innerHTML = '';
    for (const it of items()) {
      const d = document.createElement('div');
      d.className = 'ico';
      d.title = it.name + '\n' + it.path;
      d.textContent = iconLetter(it.name);
      d.onclick = async (e) => {
        e.stopPropagation();
        try { await tbp.call('shell.open', { url: it.path }); }
        catch (err) { alert('打开失败：' + (err.message || err)); }
      };
      strip.appendChild(d);
    }
    const add = document.createElement('div');
    add.className = 'ico add';
    add.textContent = '＋';
    add.title = '添加快捷方式';
    add.onclick = (e) => { e.stopPropagation(); openEditor(-1); };
    strip.appendChild(add);
  }

  function renderPanel() {
    const box = $('list');
    box.innerHTML = '';
    items().forEach((it, i) => {
      const d = document.createElement('div');
      d.className = 'it';
      d.innerHTML = '<span class="sw">' + esc(iconLetter(it.name)) + '</span>' +
        '<span class="nm">' + esc(it.name) + '</span>' +
        '<span class="pt">' + esc(it.path) + '</span>' +
        '<button data-a="e">编辑</button><button data-a="d" class="danger">删除</button>';
      d.querySelector('[data-a=e]').onclick = () => openEditor(i);
      d.querySelector('[data-a=d]').onclick = async () => {
        if (!confirm('删除「' + it.name + '」？')) return;
        cfg.items.splice(i, 1);
        await tbp.saveConfig(cfg);
        renderStrip(); renderPanel();
      };
      box.appendChild(d);
    });
    if (!items().length) box.innerHTML = '<div style="color:#4a4b55;font-size:11px;text-align:center;padding:14px 0">还没有快捷方式</div>';
  }

  function openEditor(i) {
    editIdx = i;
    const it = i >= 0 ? items()[i] : null;
    $('e-name').value = it ? it.name : '';
    $('e-path').value = it ? it.path : '';
    $('editor').classList.add('open');
  }

  $('b-add').onclick = () => openEditor(-1);
  $('e-cancel').onclick = () => $('editor').classList.remove('open');
  $('e-save').onclick = async () => {
    const name = $('e-name').value.trim();
    const path = $('e-path').value.trim();
    if (!name || !path) return;
    const list = items();
    if (editIdx >= 0) list[editIdx] = { name, path };
    else list.push({ name, path });
    cfg.items = list;
    try { await tbp.saveConfig(cfg); } catch (e) {}
    $('editor').classList.remove('open');
    renderStrip(); renderPanel();
  };
  $('e-pick').onclick = () => {
    // 走宿主对话框选程序/快捷方式（复用 fs 无对话框能力，用 file input 选择）
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.exe,.lnk,.bat,.cmd,.url';
    inp.onchange = () => { if (inp.files[0]) $('e-path').value = inp.files[0].path || inp.files[0].name; };
    inp.click();
  };

  strip.onclick = async () => {
    expanded = !expanded;
    panel.classList.toggle('open', expanded);
    $('editor').classList.remove('open');
    await tbp.call(expanded ? 'dock.expand' : 'dock.collapse', { height: 360 });
    if (expanded) renderPanel();
  };
  tbp.on('dock.collapsed', () => { expanded = false; panel.classList.remove('open'); });

  renderStrip();
  tbp.ready();
})();
</script>
</body>
</html>
